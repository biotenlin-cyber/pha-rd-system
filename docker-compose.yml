services:
  postgres:
    image: postgres:15
    container_name: pha-postgres
    environment:
      POSTGRES_DB: pha
      POSTGRES_USER: pha
      POSTGRES_PASSWORD: pha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pha"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}
