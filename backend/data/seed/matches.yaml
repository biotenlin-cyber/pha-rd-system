# 牌号-场景匹配评分（满分 100）
# 评分细则（参见 README.md）：
#   biocompat (生物相容)  30
#   mechanical (力学)     30
#   degradation (降解)    20
#   processability (工艺) 20
# recommendation_level: preferred / suitable / marginal / not_recommended

# ===== medical.suture =====
- {grade: PHBHHx, scenario: medical.suture, match_score: 92, recommendation_level: preferred,
   key_metrics: {biocompat: 30, mechanical: 27, degradation: 18, processability: 17},
   rationale: 高 HHx 含量改善韧性，断裂伸长 >300% 满足倒刺缝线弹性需求，生物相容性优秀。}
- {grade: P3HB4HB, scenario: medical.suture, match_score: 86, recommendation_level: preferred,
   key_metrics: {biocompat: 28, mechanical: 25, degradation: 18, processability: 15},
   rationale: 高 4HB 弹性体提供柔软触感，6 个月降解符合短期吸收要求。}
- {grade: PHBV, scenario: medical.suture, match_score: 65, recommendation_level: suitable,
   key_metrics: {biocompat: 28, mechanical: 18, degradation: 12, processability: 7},
   rationale: 拉伸强度足够但断裂伸长偏低，适合单股线但不适合编织/倒刺。}
- {grade: PHB, scenario: medical.suture, match_score: 40, recommendation_level: marginal,
   key_metrics: {biocompat: 28, mechanical: 8, degradation: 4, processability: 0},
   rationale: 结晶度高、加工窗口窄、脆性大，不适合作为缝线主材。}

